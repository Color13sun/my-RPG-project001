<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>設定資料集・キャラクター 一覧</title>
        <meta name="description" content="サイト概要説明">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- [if lt IE 9] -->
        <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
        <script src="http://css3-mediaqueries-js.googlecode.com/svn/trunk/css3-mediaqueries.js"></script>
        <!-- [endif] -->
        <!-- Google font setup -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Stick&display=swap" rel="stylesheet">
        <!-- Google font set -->
        <link rel="stylesheet" href="styles.css">
        <script src="char_data.js"></script>
    
    </head>
    <body>
        <header id="top">
            【自作ＲＰＧ（タイトル未定）】 - 設定資料集 📖
        </header>

        <div class="container">
            <p>
                <a href="03timeline.html">BACK</a>　
                <a href="00index.html">HOME</a>　
                <a href="05progress.html">NEXT</a>
            </p>

            <h1>📚 キャラクター 一覧</h1>

            <div class="pagetop">
                <a href="#top" title="ページの先頭に戻る">
                    <p class="box"><span>▲<br>PAGE<br>TOP</span></p>
                </a>
            </div>
            <button id="modeToggle">🌙 ダークモード</button>
            <script src="darkmode.js"></script>

            <div class="controls">
                <div>
                    <label for="search-input">単語検索：</label>
                    <input type="text" id="search-input" 
                        placeholder="名称を入力" 
                        oninput="renderTable()">
                </div>
                
                <div>
                    <label for="category-select">　カテゴリー：</label>
                    <select id="category-select" onchange="renderTable()"></select>
                </div>
                
                <div>
                    <label>　ソート：</label>
                    <button id="sort_reading" class="sort_btn" 
                            onclick="setSortMode('reading')">50音順</button>
                    <button id="sort_number" class="sort_btn active" 
                            onclick="setSortMode('number')">番号順</button>
                </div>
            </div>

            <table id="entry-list-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>名称</th>
                        <th>カテゴリー</th>
                        <th>概要</th>
                    </tr>
                </thead>
                <tbody id="entry-tbody">
                </tbody>
            </table>

            <br><br><br>
            <p>
                <a href="03timeline.html">BACK</a>　
                <a href="00index.html">HOME</a>　
                <a href="05progress.html">NEXT</a>
            </p>
        </div>

        <footer>
            &copy; 2025 【Color-sun】　All Rights Reserved.
        </footer>

        <script>
            const tbody = document.getElementById('entry-tbody');
            const searchInput = document.getElementById('search-input');
            const categorySelect = document.getElementById('category-select');

            /**
             * カテゴリー選択肢を生成する
             */
            function setupCategorySelect() {
                // 全てのカテゴリー配列をフラット化し、重複を削除
                const allCategories = SETTING_DATA.flatMap(item => item.category);
                const categories = [...new Set(allCategories)].sort();

                categorySelect.innerHTML = '';

                // 「全て表示」のオプションを追加
                const allOption = document.createElement('option');
                allOption.value = 'all';
                allOption.textContent = '全て表示';
                categorySelect.appendChild(allOption);

                // 各カテゴリーのオプションを追加
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categorySelect.appendChild(option);
                });
            }

            let currentSortMode = 'number'; // デフォルトのソート

            // ボタンクリックでモードを切り替える
            function setSortMode(mode) {
                currentSortMode = mode;

                // ボタンの見た目（アクティブ状態）を切り替える
                document.querySelectorAll('.sort_btn').forEach(btn => btn.classList.remove('active'));
                if (mode === 'reading') {
                    document.getElementById('sort_reading').classList.add('active');
                } else {
                    document.getElementById('sort_number').classList.add('active');
                }
                renderTable();
            }

            /**
             * データをフィルタリング、並び替え、HTMLテーブルに反映させる
             */
            function renderTable() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const selectedCategory = categorySelect.value;

                // フィルタリング
                let filteredData = SETTING_DATA.filter(item => {
                    // キーワード検索フィルタ
                    const matchesSearch = searchTerm === '' || 
                                        item.word.toLowerCase().includes(searchTerm) || 
                                        item.reading.toLowerCase().includes(searchTerm);
                    
                    // カテゴリーフィルタ
                    const matchesCategory = selectedCategory === 'all' || 
                                            item.category.includes(selectedCategory);

                    // 両方の条件を満たすもののみ残す
                    return matchesSearch && matchesCategory;
                });

                // 並び替えロジック
                if (currentSortMode === 'reading') {
                    // 50音順
                    filteredData.sort((a, b) => a.reading.localeCompare(b.reading, 'ja'));
                } else {
                    // 番号順（sortNoが未定義の場合、最後尾へ）
                    filteredData.sort((a, b) => (a.sortNo || 999) - (b.sortNo || 999));
                }

                // テーブルの描画
                tbody.innerHTML = '';

                if (filteredData.length === 0) {
                    const emptyRow = tbody.insertRow();
                    const cell = emptyRow.insertCell();
                    cell.colSpan = 4;
                    cell.style.textAlign = 'center';
                    cell.textContent = '該当するエントリが見つかりませんでした。';
                    return;
                }

                filteredData.forEach(item => {
                    const row = tbody.insertRow();

                    const noCell = row.insertCell();
                    noCell.textContent = item.sortNo || '-';

                    const nameCell = row.insertCell();
                    const link = document.createElement('a');
                    link.href = `char_detail.html?id=${item.id}`;

                    if (item.wordHtml) {
                        link.innerHTML = item.wordHtml;
                    } else {
                        link.textContent = item.word;
                    }

                    nameCell.appendChild(link);
                    
                    row.insertCell().textContent = item.category.join(' / ');
                    row.insertCell().textContent = item.meaning.join('');
                });
            }

            // ページロード時の初期実行
            setupCategorySelect(); // カテゴリー選択肢を準備
            renderTable();         // 最初の表示を実行
        </script>
    </body>
</html>
