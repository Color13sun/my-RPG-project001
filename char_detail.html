<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>自作RPG設定資料集｜詳細ページ</title>
        <meta name="description" content="サイト概要説明">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- [if lt IE 9] -->
        <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
        <script src="http://css3-mediaqueries-js.googlecode.com/svn/trunk/css3-mediaqueries.js"></script>
        <!-- [endif] -->
        <!-- Google font setup -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Stick&display=swap" rel="stylesheet">
        <!-- Google font set -->
        <link rel="stylesheet" href="styles.css">
        <script src="char_data.js"></script>
    </head>
<body>
    <header>
        【自作ＲＰＧ（タイトル未定）】 - 設定資料集
    </header>

    <div class="container">
        <a href="04char_list.html" class="back-link">← 一覧に戻る</a> 🏠️
        <a href="00index.html" class="back-link">ホームページに戻る</a>
    
        <div class="pagetop">
            <a href="#top" title="ページの先頭に戻る">
                <p class="box"><span>▲<br>PAGE<br>TOP</span></p>
            </a>
        </div>
        <button id="modeToggle">🌙 ダークモード</button>
        <script src="darkmode.js"></script>

        <div id="detail-content">
            <p>エントリを読み込み中です...</p>
        </div>
    </div>

    <footer>
        &copy; 2025 【Color-sun】 All Rights Reserved.
    </footer>

    <script>
        const detailKeyMap = {
            // 共通項目マップ
            '': '',
            '': '',
        };
        
        function renderDetailPage() {
            const entryId = new URLSearchParams(window.location.search).get('id');
            const data = SETTING_DATA.find(item => item.id === entryId);
            const contentDiv = document.getElementById('detail-content');

            if (!data) {
                contentDiv.innerHTML = '<h1>エラー: エントリが見つかりません</h1>';
                return;
            }

            const displayTitle = data.wordHtml ? data.wordHtml : data.word;
            document.title = `設定資料 - ${data.word}`;
            
            // --- コンテンツ生成ロジック ---
            let dynamicContentHtml = '';
            let indexItems = []; // 目次用のデータを蓄積する配列

            // 配列データを結合する処理
            const formatValue = (val) => {
                // valが[[データの配列], "区切り文字"]という形式かどうか
                if (Array.isArray(val) && val.length === 2 && Array.isArray(val[0])) {
                    // 指定された区切り文字で結合
                    return val[0].join(val[1]);
                }
                // valが単なる配列なら、以下で定義するデフォルトの区切り文字を使う
                if (Array.isArray(val)) {
                    return val.join('');
                }
                return val;
            }

            // details内の要素を順番に処理
            Object.entries(data.details).forEach(([key, value], index) => {
                if (key === 'fullDescription' || key === 'image') return;

                let displayName = '';
                let displayValue = '';
                let isH2 = false;
                let isNoLabel = false;

                // 見出し判定（h2_x）
                if (key.startsWith('h2')) {
                    isH2 = true;
                    displayName = formatValue(value);
                }
                // カスタムdt判定
                else if (Array.isArray(value) &&
                        (value.length === 2 || value.length === 3)) {
                    // ["ラベル", 内容]または["ラベル", 内容, "区切り文字"]
                    if (value[0] === null) {
                        isNoLabel = true;
                        displayValue = (value.length === 3) ?
                            value[1].join(value[2]) :formatValue(value[1]);
                    } else {
                        displayName = value[0];
                        displayValue = (value.length === 3) ?
                            value[1].join(value[2]) :formatValue(value[1]);
                    }
                }
                // 共通・通常判定
                else {
                    displayName = detailKeyMap[key] || key;
                    displayValue = formatValue(value);
                }

                // h2処理
                if (isH2) {
                    // 値が "h2" なら見出しとして出力
                    // IDを振って目次配列に追加
                    // dlの外に出すために一度 dl を閉じる必要があるが、
                    // ここでは「dlの中で完結させない」新しい組み立て方をする
                    const sectionId = `section-${index}`;
                    indexItems.push({ id: sectionId, title: displayName });
                    dynamicContentHtml += 
                        `</dl><h2 id="$[sectionId]">${displayName}</h2><dl>`;
                } else if (isNoLabel) {
                    // 見出しなし：ddタグのみを出力
                    dynamicContentHtml += 
                        `<p class="full-width-p">${displayValue}</p>`;
                } else {
                    // 通常の項目 (dt/dd)
                    dynamicContentHtml += 
                        `<dt>${displayName}</dt><dd>${displayValue}</dd>`;
                }
            });

            /*
            // detailsArray (複数データ) の処理も同様に dl 内に追加
            if (data.detailsArray) {
                Object.entries(data.detailsArray).forEach(([key, [valueArray, delimiter]]) => {
                    if (!Array.isArray(valueArray)) return;
                    const displayName = detailKeyMap[key] || key;
                    const combinedValue = valueArray.join(delimiter);
                    dynamicContentHtml += `<dt>${displayName}</dt><dd>${combinedValue}</dd>`;
                });
            }
            */

            // 目次処理
            let indexHtml = '';
            if (indexItems.length > 0) {
                indexHtml = `
                    <div class="page-index">
                        <h3>目次</h3>
                        <ul>
                            ${indexItems.map(item => `<li><a href="#${item.id}">
                                ${item.title}</a></li>`).join('')}
                        </ul>
                    </div>
                    <hr>
                `;
            }


            // 日付処理
            /*const formattedDate = new Date(data.updatedAt).toLocaleDateString('ja-JP', { 
                year: 'numeric', month: '2-digit', day: '2-digit'
            });

            ${data.details.image ? `<img src="${data.details.image}" alt="${data.word}">` : ''}
            */

            // 表 (stats) の生成
            let statsTableHtml = '';
            if (data.stats && data.stats.length > 0) {
                const headerRow = data.statHeaders.map(h => `<th>${h}</th>`).join('');
                const tbodyContent = data.stats.map(row => 
                    `<tr>${row.map(cell => `<td>${cell !== null ? cell : ''}</td>`).join('')}</tr>`
                ).join('');
                statsTableHtml = `
                    <table class="stats-table">
                        ${data.statTitle ? `<caption class="stats-caption">${data.statTitle}</caption>` : ''} 
                        <thead><tr>${headerRow}</tr></thead>
                        <tbody>${tbodyContent}</tbody>
                    </table>
                `;
            }
            
            // 全体の組み立て
            // dynamicContentHtml は最初と最後に <dl> の整合性を合わせる
            contentDiv.innerHTML = `
                <h1>${displayTitle}</h1>
                
                <div class="info-box">
                    <dl>
                        <dt>カテゴリー：</dt><dd>${data.category.join(' / ')}</dd>
                        <dt>概要：</dt><dd>${data.meaning.join('')}</dd>
                    </dl>
                    <hr>
                    ${indexHtml}
                    <dl>
                        ${dynamicContentHtml}
                    </dl>
                </div>

                ${statsTableHtml}
            `;

            // 空の <dl></dl> が生成されるのを防ぐ微調整（任意）
            contentDiv.innerHTML = contentDiv.innerHTML.replace(/<dl>\s*<\/dl>/g, '');
        }

        renderDetailPage();
    </script>
</body>
</html>
